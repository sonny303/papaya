name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.build-artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.build-artifact.outputs.artifact-digest }}
      source-tree: ${{ steps.source.outputs.tree }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Resolve source identity
        id: source
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - name: Initialize source evidence
        run: node scripts/write-ci-evidence.mjs source --repository "${{ github.repository }}" --source-revision "${{ github.sha }}" --source-tree "${{ steps.source.outputs.tree }}" --workflow-run-id "${{ github.run_id }}" --workflow-run-attempt "${{ github.run_attempt }}"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit locked dependencies
        id: dependency-audit
        run: pnpm audit --audit-level=moderate
      - name: Verify source
        id: source-verification
        run: pnpm verify:source
      - name: Build once
        id: candidate-build
        run: pnpm build
      - name: Verify release manifest
        id: release-manifest
        run: pnpm release:verify
      - name: Verify built output
        id: built-output
        run: pnpm verify:dist
      - name: Upload candidate build
        id: build-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: papaya-build-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          overwrite: false
          include-hidden-files: false
      - name: Record candidate provenance
        run: node scripts/write-ci-evidence.mjs provenance --repository "${{ github.repository }}" --source-revision "${{ github.sha }}" --source-tree "${{ steps.source.outputs.tree }}" --workflow-run-id "${{ github.run_id }}" --workflow-run-attempt "${{ github.run_attempt }}" --artifact-id "${{ steps.build-artifact.outputs.artifact-id }}" --artifact-name "papaya-build-${{ github.sha }}-${{ github.run_attempt }}" --artifact-digest "${{ steps.build-artifact.outputs.artifact-digest }}" --publication-mode preview
      - name: Finalize source evidence
        if: always()
        run: node scripts/write-ci-evidence.mjs source --repository "${{ github.repository }}" --source-revision "${{ github.sha }}" --source-tree "${{ steps.source.outputs.tree }}" --workflow-run-id "${{ github.run_id }}" --workflow-run-attempt "${{ github.run_attempt }}" --dependency-audit "${{ steps.dependency-audit.outcome || 'skipped' }}" --source-verification "${{ steps.source-verification.outcome || 'skipped' }}" --build "${{ steps.candidate-build.outcome || 'skipped' }}" --release-manifest "${{ steps.release-manifest.outcome || 'skipped' }}" --built-output "${{ steps.built-output.outcome || 'skipped' }}"
      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            evidence/source-verification.json
            evidence/provenance.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false
          include-hidden-files: false

  artifact-contract:
    name: Verify downloaded artifact
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download candidate build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          digest-mismatch: error
      - name: Verify release manifest
        run: pnpm release:verify
      - name: Verify downloaded output
        run: pnpm verify:dist

  browser:
    name: Browser (${{ matrix.project }})
    needs: [build, artifact-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Initialize browser evidence
        run: node scripts/write-ci-evidence.mjs browser --repository "${{ github.repository }}" --source-revision "${{ github.sha }}" --source-tree "${{ needs.build.outputs.source-tree }}" --workflow-run-id "${{ github.run_id }}" --workflow-run-attempt "${{ github.run_attempt }}" --artifact-id "${{ needs.build.outputs.artifact-id }}" --artifact-name "papaya-build-${{ github.sha }}-${{ github.run_attempt }}" --artifact-digest "${{ needs.build.outputs.artifact-digest }}" --project "${{ matrix.project }}"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download candidate build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          digest-mismatch: error
      - name: Verify release manifest
        id: artifact-verification
        run: pnpm release:verify
      - name: Install browsers
        id: browser-install
        run: pnpm exec playwright install --with-deps ${{ matrix.project }}
      - name: Run browser tests
        id: browser-tests
        run: pnpm test:e2e --project=${{ matrix.project }}
      - name: Run Lighthouse budgets
        id: lighthouse
        if: matrix.project == 'chromium'
        run: pnpm performance:lighthouse
      - name: Finalize browser evidence
        if: always()
        run: node scripts/write-ci-evidence.mjs browser --repository "${{ github.repository }}" --source-revision "${{ github.sha }}" --source-tree "${{ needs.build.outputs.source-tree }}" --workflow-run-id "${{ github.run_id }}" --workflow-run-attempt "${{ github.run_attempt }}" --artifact-id "${{ needs.build.outputs.artifact-id }}" --artifact-name "papaya-build-${{ github.sha }}-${{ github.run_attempt }}" --artifact-digest "${{ needs.build.outputs.artifact-digest }}" --project "${{ matrix.project }}" --artifact-verification "${{ steps.artifact-verification.outcome || 'skipped' }}" --browser-install "${{ steps.browser-install.outcome || 'skipped' }}" --browser-tests "${{ steps.browser-tests.outcome || 'skipped' }}" --lighthouse "${{ steps.lighthouse.outcome || 'skipped' }}"
      - name: Upload bounded browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence-${{ matrix.project }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            evidence/browser-${{ matrix.project }}.json
            evidence/lighthouse/
          if-no-files-found: error
          retention-days: 7
          overwrite: false
          include-hidden-files: false
